# DANFE/NF-e Local Renamer
#
# Development layout: the application package lives in app/, development-only
# helpers (dataset inspection, corpus evaluation) live in tools/.

[project]
name = "danfe-renamer"
version = "1.3.4"
description = "Local, offline renamer for NF-e/DANFE PDFs"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "pymupdf>=1.24,<2",
    "brazilfiscalreport>=1.3.1,<2",
    "defusedxml>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
addopts = "-q"
